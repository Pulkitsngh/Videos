<title>Navjyoti Vermicompost Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: dark-green sidebar menu grouped by stage (top scroller on phones), sticky tool bar with the batch switcher, one working pane per register. */
:root {
  --bg: #f2f5f1; --surface: #ffffff; --surface-2: #e8eee7; --fg: #16201b; --muted: #58685f; --line: #d3ddd4;
  --accent: #1c7148; --accent-fg: #ffffff; --soil: #6b4424;
  --s1: #1e8a5a; --s2: #5b5bd6;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300; --c7: #4a3aa7; --c8: #e34948;
  --good: #1d7443; --good-bg: #dcefe2; --warn: #9a5b00; --warn-bg: #fbecd2; --bad: #b3261e; --bad-bg: #f9dedb; --info-bg: #e3e6fa;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --logo-bg: #ffffff; --logo-ink: #005d28;
  --brand: #143f2b; --brand-fg: #eef6f0; --brand-muted: #a6c8b4; --brand-hi: #1d5139; --brand-line: #2f6a4e; --brand-on: #dff1e5;
  --r: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1512; --surface: #161e1a; --surface-2: #1e2823; --fg: #e2ebe5; --muted: #95a89c; --line: #2b3831;
  --accent: #4dbf8a; --accent-fg: #07130d; --soil: #d19a6a;
  --s1: #3ba877; --s2: #7575e6;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
  --good: #63cf90; --good-bg: #173524; --warn: #e8ad4a; --warn-bg: #3a2a0e; --bad: #f47d73; --bad-bg: #3d1a17; --info-bg: #23264a;
  --brand: #0c1c14; --brand-fg: #e2ebe5; --brand-muted: #8fae9c; --brand-hi: #17301f; --brand-line: #24463a; --brand-on: #4dbf8a;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1512; --surface: #161e1a; --surface-2: #1e2823; --fg: #e2ebe5; --muted: #95a89c; --line: #2b3831;
  --accent: #4dbf8a; --accent-fg: #07130d; --soil: #d19a6a;
  --s1: #3ba877; --s2: #7575e6;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
  --good: #63cf90; --good-bg: #173524; --warn: #e8ad4a; --warn-bg: #3a2a0e; --bad: #f47d73; --bad-bg: #3d1a17; --info-bg: #23264a;
  --brand: #0c1c14; --brand-fg: #e2ebe5; --brand-muted: #8fae9c; --brand-hi: #17301f; --brand-line: #24463a; --brand-on: #4dbf8a;
  color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--f-body); }
button, input, select, textarea { font: inherit; color: inherit }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em }
.num, td.n, .mono { font-variant-numeric: tabular-nums }
.mono { font-family: var(--f-mono); font-size: 12.5px }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100dvh }
.side { position: sticky; top: env(safe-area-inset-top, 0px); height: 100dvh; overflow-y: auto; background: var(--brand); color: var(--brand-fg); padding: 18px 12px; display: flex; flex-direction: column; gap: 22px; border-right: 1px solid var(--line) }
.brand { display: grid; gap: 8px; padding: 0 2px; min-width: 0 }
.logo-card { background: var(--logo-bg); border-radius: 12px; padding: 14px 12px 10px; display: grid; justify-items: center; gap: 6px }
.logo-card svg { width: 116px; height: auto; display: block }
.logo-card .group { font-size: 13px; font-weight: 600; letter-spacing: .04em; color: var(--logo-ink) }
.brand .tag { color: var(--brand-muted); font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; text-align: center }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap }
nav.tabs { display: grid; gap: 16px }
.nav-group { display: grid; gap: 2px }
.nav-group > span { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--brand-muted); padding: 0 10px 4px; font-weight: 600 }
nav.tabs button { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--brand-fg); cursor: pointer; font-weight: 500; white-space: nowrap }
nav.tabs button svg { width: 18px; height: 18px; flex: none; color: var(--brand-muted) }
nav.tabs button:hover { background: var(--brand-hi) }
nav.tabs button[aria-current="page"] { background: var(--brand-on); color: var(--brand); font-weight: 600 }
nav.tabs button[aria-current="page"] svg { color: var(--brand) }
nav.tabs button:focus-visible { outline: 2px solid var(--brand-fg); outline-offset: 1px }
.work { min-width: 0 }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line) }
.top-row { display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; padding: 10px 24px }
.crumb { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center }
.crumb b { color: var(--fg); font-weight: 600 }
.top-tools { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap }
.sync { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2) }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted) }
.sync.live i { background: var(--good) } .sync.off i { background: var(--bad) }
@media (max-width: 1000px) {
  .app { grid-template-columns: minmax(0, 1fr) }
  .side { position: static; height: auto; padding: 14px 16px 0; gap: 12px; border-right: 0 }
  .brand { grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 12px }
  .logo-card { padding: 8px 12px 6px; gap: 3px } .logo-card svg { width: 64px } .logo-card .group { font-size: 11.5px }
  .brand .tag { text-align: left }
  nav.tabs { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: thin }
  .nav-group { display: contents } .nav-group > span { display: none }
  .top-row { padding-inline: 16px }
}
main { max-width: 1400px; padding-inline: 24px; padding-block: 22px 60px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px }
@media (max-width: 1000px) { main { padding-inline: 16px } }
.page-head { display: flex; align-items: end; gap: 12px 16px; flex-wrap: wrap }
.page-head h2 { font-size: 24px }
.page-head p { margin: 2px 0 0; color: var(--muted); max-width: 70ch }
.page-head .tools { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.ph { display: flex; gap: 12px; align-items: start; min-width: 0 }
.ph > div { min-width: 0 }
.ph-ic { width: 42px; height: 42px; border-radius: 11px; display: grid; place-items: center; flex: none; background: color-mix(in srgb, var(--k) 15%, var(--surface)); color: var(--k) }
.ph-ic svg { width: 22px; height: 22px }
.hero { background: var(--brand); color: var(--brand-fg); border-radius: 12px; padding: 20px 22px; display: flex; flex-wrap: wrap; align-items: end; gap: 14px 20px }
.hero .eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--brand-muted) }
.hero h2 { font-size: 28px; color: var(--brand-fg); margin-top: 2px }
.hero p { margin: 4px 0 0; color: var(--brand-muted); max-width: 70ch }
.hero .tools { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap }
.hero .btn { background: var(--brand-hi); border-color: var(--brand-line); color: var(--brand-fg) }
.hero .btn:hover { border-color: var(--brand-muted) }
.hero .btn.primary { background: var(--brand-on); border-color: var(--brand-on); color: var(--brand) }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: var(--r); cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap }
.btn:hover { border-color: var(--muted) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg) }
.btn.primary:hover { filter: brightness(1.08) }
.btn.danger { color: var(--bad); border-color: var(--bad) }
.btn.small { padding: 4px 9px; font-size: 13px }
select.sel, input.search { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 7px 10px }
input.search { min-width: 0; width: 220px }

.banner { padding: 12px 14px; border-radius: var(--r); background: var(--warn-bg); color: var(--fg); border: 1px solid var(--line) }
.banner b { color: var(--warn) }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px }
@media (max-width: 900px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px } }
.kpi { --k: var(--accent); background: color-mix(in srgb, var(--k) 6%, var(--surface)); border: 1px solid color-mix(in srgb, var(--k) 22%, var(--line)); border-top: 3px solid var(--k); border-radius: var(--r); padding: 12px 14px 13px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-content: start; min-width: 0 }
.kpi .l { grid-column: 1; grid-row: 1; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; color: color-mix(in srgb, var(--k) 70%, var(--fg)) }
.kpi .ic { grid-column: 2; grid-row: 1; align-self: start; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--k) 15%, var(--surface)); color: var(--k) }
.kpi .ic svg { width: 20px; height: 20px }
.kpi .v { grid-column: 1 / -1; grid-row: 2; white-space: nowrap; font-family: var(--f-display); font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2 }
.kpi .v small { font-size: 15px; font-weight: 600; color: var(--muted); margin-left: 3px }
.kpi .s { grid-column: 1 / -1; grid-row: 3; font-size: 12.5px; color: var(--muted) }

/* Process flow */
.flow { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden }
.flow > div { padding: 12px 18px 12px 14px; position: relative; border-right: 1px solid var(--line); border-top: 3px solid var(--k, var(--accent)); min-width: 0 }
.flow > div:not(:last-child)::after { content: "›"; position: absolute; right: -11px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); font-weight: 700; line-height: 1; z-index: 1 }
.flow > div:last-child { border-right: 0 }
.flow .st { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: color-mix(in srgb, var(--k, var(--accent)) 70%, var(--fg)); font-weight: 600 }
.flow .q { font-family: var(--f-display); font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums }
.flow .d { font-size: 12px; color: var(--muted) }
@media (max-width: 760px) { .flow { grid-template-columns: 1fr 1fr } .flow > div { border-bottom: 1px solid var(--line) } .flow > div::after { display: none } }

.grid2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 20px; align-items: start }
@media (max-width: 900px) { .grid2 { grid-template-columns: minmax(0, 1fr) } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; display: grid; gap: 12px; align-content: start }
.panel > h3 { font-size: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--line) }
.panel .sub { color: var(--muted); font-size: 12.5px; margin: -4px 0 0 }

.alerts { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none }
.alerts li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; padding: 9px 10px; border-radius: 6px; background: var(--surface-2) }
.alerts li.warn { background: var(--warn-bg) } .alerts li.bad { background: var(--bad-bg) } .alerts li.ok { background: var(--good-bg) }
.alerts .ic { font-weight: 700; font-family: var(--f-mono); width: 18px; text-align: center }
.alerts li.warn .ic { color: var(--warn) } .alerts li.bad .ic { color: var(--bad) } .alerts li.ok .ic { color: var(--good) }
.alerts b { display: block; font-weight: 600 }
.alerts span { color: var(--muted); font-size: 12.5px }

/* Tables */
.tbl-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r) }
table { border-collapse: collapse; width: 100%; font-size: 13px }
th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: top }
td.wrap { white-space: normal; min-width: 180px; max-width: 320px }
th { position: sticky; top: 0; background: color-mix(in srgb, var(--accent) 13%, var(--surface)); font-weight: 600; font-size: 12px; color: var(--fg); z-index: 1 }
tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--surface-2) 45%, var(--surface)) }
th button { all: unset; cursor: pointer; display: inline-flex; gap: 4px }
th button:focus-visible { outline: 2px solid var(--accent) }
th.n, td.n { text-align: right; font-variant-numeric: tabular-nums }
tbody tr { cursor: default }
tbody tr.click { cursor: pointer }
tbody tr.click:hover td { background: color-mix(in srgb, var(--accent) 9%, var(--surface)) }
tfoot td { font-weight: 600; background: color-mix(in srgb, var(--accent) 8%, var(--surface-2)); border-bottom: 0 }
td.off { color: var(--bad); font-weight: 600 }
.empty { padding: 32px 16px; text-align: center; color: var(--muted) }
.empty b { display: block; color: var(--fg); font-size: 15px; margin-bottom: 4px }

.chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--surface-2); color: var(--fg) }
.chip.good { background: var(--good-bg); color: var(--good) } .chip.warn { background: var(--warn-bg); color: var(--warn) }
.chip.bad { background: var(--bad-bg); color: var(--bad) } .chip.info { background: var(--info-bg); color: var(--s2) }

/* Beds */
.bed-sum { display: flex; flex-wrap: wrap; gap: 8px }
.beds { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px }
.bed { all: unset; box-sizing: border-box; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 9px 8px 12px; display: grid; gap: 1px; position: relative; overflow: hidden }
.bed::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--muted) }
.bed.s-active::before { background: var(--s1) } .bed.s-ready::before, .bed.s-overdue::before { background: var(--warn) }
.bed.s-harvested::before { background: var(--soil) } .bed.s-filled::before { background: var(--s2) }
.bed:hover { border-color: var(--muted) }
.bed:focus-visible { outline: 2px solid var(--accent) }
.bed .id { font-family: var(--f-mono); font-weight: 500; font-size: 12.5px }
.bed .st { font-size: 11.5px; color: var(--muted) }
.bed .kg { font-variant-numeric: tabular-nums; font-weight: 600 }
.bed.s-overdue .st { color: var(--warn); font-weight: 600 }

/* Chart */
.chart { position: relative; overflow-x: auto }
.chart svg { width: 100%; min-width: 540px; height: auto; display: block }
.chart .tip { position: absolute; pointer-events: none; background: var(--fg); color: var(--bg); padding: 6px 9px; border-radius: 6px; font-size: 12px; white-space: nowrap; transform: translate(-50%, -100%); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted) }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px }
.bars { display: grid; gap: 7px }
.bars .row { display: grid; grid-template-columns: minmax(90px, 130px) 1fr auto; gap: 10px; align-items: center; font-size: 13px }
.bars .row span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.bars .track { height: 12px }
.bars .bar { height: 12px; background: var(--s1); border-radius: 0 4px 4px 0; min-width: 2px }
.bars .row:hover .bar { filter: brightness(1.15) }

/* Trace */
.trace { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px }
.trace .stage { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 6px; align-content: start; min-width: 0 }
.trace .stage h4 { margin: 0; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--soil) }
.trace .stage .q { font-family: var(--f-display); font-weight: 700; font-size: 19px }
.trace ul { margin: 0; padding: 0; list-style: none; font-family: var(--f-mono); font-size: 12px; display: grid; gap: 2px; max-height: 180px; overflow: auto }

/* Dialog */
dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; background: var(--surface); color: var(--fg); width: min(760px, calc(100vw - 24px)); max-height: calc(100dvh - 40px) }
dialog::backdrop { background: rgb(0 0 0 / .45) }
dialog form { display: grid; grid-template-rows: auto 1fr auto; max-height: calc(100dvh - 42px) }
.dlg-h { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px }
.dlg-h h3 { font-size: 18px }
.dlg-h .x { margin-left: auto }
.dlg-b { padding: 16px 18px; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px 14px }
.dlg-f { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.dlg-f .sp { flex: 1 }
.fld { display: grid; gap: 4px; min-width: 0 }
.fld.wide { grid-column: 1 / -1 }
.fld label { font-size: 12px; font-weight: 600; color: var(--muted) }
.fld input, .fld select, .fld textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 7px 9px; width: 100%; min-width: 0 }
.fld textarea { min-height: 64px; resize: vertical }
.turns { display: grid; gap: 6px }
.turn-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) auto; gap: 6px; align-items: end }
@media (max-width: 560px) { .turn-row { grid-template-columns: 1fr 1fr } }
.note { font-size: 12.5px; color: var(--muted); grid-column: 1 / -1; margin: 0 }

/* Reports */
.rep-controls { display: grid; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px }
.ctl-row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center }
.ctl-row .lbl { font-size: 11.5px; font-weight: 600; color: var(--muted); min-width: 76px; text-transform: uppercase; letter-spacing: .06em }
.seg { display: flex; flex-wrap: wrap; gap: 4px }
.seg button { border: 1px solid var(--line); background: var(--surface); padding: 5px 12px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 500 }
.seg button:hover { border-color: var(--muted) }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg) }
.tick { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px 4px 9px; cursor: pointer; font-size: 13px; background: var(--surface) }
.tick input { accent-color: var(--accent); margin: 0 }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex: none }
.legend i.sq { width: 10px; height: 10px; border-radius: 3px }
.hbar { display: grid; gap: 9px }
.hb-row { display: grid; grid-template-columns: minmax(80px, 170px) minmax(0, 1fr); gap: 10px; align-items: center }
.hb-lbl { font-size: 13px; overflow-wrap: anywhere; line-height: 1.3 }
.hb-bars { display: grid; gap: 3px; min-width: 0 }
.hb-line { display: flex; align-items: center; gap: 8px; min-width: 0 }
.hb-bar { height: 14px; border-radius: 0 4px 4px 0; min-width: 2px }
.hb-line:hover .hb-bar { filter: brightness(1.12) }
.hb-val { font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap }
.finds { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px }
.finds li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start }
.finds li .sw { margin-top: 5px }
.finds b { display: block; font-weight: 600 } .finds span:not(.sw) { color: var(--muted); font-size: 12.5px }
.smalls { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px }

function sortedRows(key) {
  const def = REG[key], ui = state.ui[key] || (state.ui[key] = { q: '', sort: def.sort[0], dir: def.sort[1] });

  const col = def.cols.find(c => c.k === ui.sort);

    const x = get(a), y = get(b);

/* cumulative produced vs sold step chart */
let chartData = null;
function cumChart() {
  const hv = rows('harvest').filter(r => isISO(r.date) && isNum(r.netKg)), sl = rows('sales').filter(r => isISO(r.date) && isNum(r.qtyKg));
  if (!hv.length && !sl.length) { chartData = null; return `<div class="empty">The chart fills in once harvest and sales entries have dates.</div>`; }
  const cum = list => { const m = {}; list.forEach(([d, v]) => m[d] = (m[d] || 0) + v); let t = 0; return Object.keys(m).sort().map(d => [d, t += m[d]]); };
  const P = cum(hv.map(r => [r.date, r.netKg])), S = cum(sl.map(r => [r.date, r.qtyKg]));
  const dates = uniq([...P, ...S].map(p => p[0])).sort();
  const t0 = +new Date(dates[0] + 'T00:00:00') - 5 * 864e5, t1 = Math.max(+new Date(dates[dates.length - 1] + 'T00:00:00'), t0 + 20 * 864e5) + 5 * 864e5;
  const W = 720, H = 280, ml = 58, mr = 128, mt = 14, mb = 30;
  const ymaxRaw = Math.max(1, ...P.map(p => p[1]), ...S.map(p => p[1]));
  const step = (() => { const raw = ymaxRaw / 4, mag = 10 ** Math.floor(Math.log10(raw)); return [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => s >= raw); })();
  const ymax = Math.ceil(ymaxRaw / step) * step;
  const x = d => ml + ((+new Date(d + 'T00:00:00') - t0) / (t1 - t0)) * (W - ml - mr);
  const y = v => mt + (1 - v / ymax) * (H - mt - mb);
  const path = s => s.length ? `M${x(s[0][0]).toFixed(1)},${y(0)} ` + s.map((p, i) => `V${y(i ? s[i - 1][1] : 0).toFixed(1)} H${x(p[0]).toFixed(1)} V${y(p[1]).toFixed(1)}`).join(' ') + ` H${(W - mr).toFixed(1)}` : '';
  let grid = '';
  for (let v = 0; v <= ymax + 1e-9; v += step) grid += `<line x1="${ml}" x2="${W - mr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${ml - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${v >= 1000 ? fmt(v / 1000, 1) + 't' : fmt(v)}</text>`;
  const m0 = new Date(t0); m0.setDate(1); m0.setMonth(m0.getMonth() + 1);
  const months = []; for (let d = new Date(m0); +d <= t1; d.setMonth(d.getMonth() + 1)) months.push(localISO(d));
  const every = Math.ceil(months.length / 7);
  const xt = months.filter((_, i) => i % every === 0).map(d => `<line x1="${x(d)}" x2="${x(d)}" y1="${H - mb}" y2="${H - mb + 4}" stroke="var(--muted)"/><text x="${x(d)}" y="${H - mb + 17}" text-anchor="middle" font-size="11" fill="var(--muted)">${new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { month: 'short', year: '2-digit' })}</text>`).join('');
  const endLbl = (s, name, color, dy) => { if (!s.length) return ''; const v = s[s.length - 1][1]; return `<circle cx="${W - mr}" cy="${y(v)}" r="4" fill="${color}" stroke="var(--surface)" stroke-width="2"/><text x="${W - mr + 8}" y="${y(v) + 4 + dy}" font-size="12" fill="var(--fg)" font-weight="600">${name} ${tons(v)}t</text>`; };
  const pv = P.length ? P[P.length - 1][1] : 0, sv = S.length ? S[S.length - 1][1] : 0;
  const dyP = Math.abs(y(pv) - y(sv)) < 16 ? (pv >= sv ? -8 : 8) : 0;
  chartData = { P, S, dates, x, y, W, H, ml, mr, mt, mb };
  return `<div class="legend"><span><i style="background:var(--s1)"></i>Produced (net)</span><span><i style="background:var(--s2)"></i>Sold</span></div>
  <div class="chart" id="cumChart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative produced ${fmt(pv)} kg versus sold ${fmt(sv)} kg">
    ${grid}${xt}<line x1="${ml}" x2="${W - mr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)"/>
    <path d="${path(P)}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/>
    <path d="${path(S)}" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 3"/>
    ${endLbl(P, 'Produced', 'var(--s1)', dyP)}${endLbl(S, 'Sold', 'var(--s2)', -dyP)}
    <line id="cx" y1="${mt}" y2="${H - mb}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/>
    <rect id="chit" x="${ml}" y="${mt}" width="${W - ml - mr}" height="${H - mt - mb}" fill="transparent"/>
  </svg><div class="tip" id="ctip" hidden></div></div>`;
}
function wireChart() {
  const box = $('#cumChart'); if (!box || !chartData) return;
  const svg = box.querySelector('svg'), tip = $('#ctip'), line = $('#cx');
  const { P, S, dates, x, W } = chartData;
  const at = (s, d) => { let v = 0; for (const p of s) { if (p[0] <= d) v = p[1]; else break; } return v; };
  const move = ev => {
    const r = svg.getBoundingClientRect(), vx = (ev.clientX - r.left) / r.width * W;
    let best = dates[0]; dates.forEach(d => { if (Math.abs(x(d) - vx) < Math.abs(x(best) - vx)) best = d; });
    const px = x(best); line.setAttribute('x1', px); line.setAttribute('x2', px); line.setAttribute('visibility', 'visible');
    tip.hidden = false; tip.style.left = (px / W * r.width) + 'px'; tip.style.top = '8px';
    tip.style.transform = px / W > 0.7 ? 'translate(-100%, 0)' : px / W < 0.25 ? 'translate(0, 0)' : 'translate(-50%, 0)';
    tip.innerHTML = `<b>${fdate(best)}</b><br>Produced ${fmt(at(P, best))} kg<br>Sold ${fmt(at(S, best))} kg`;
  };
  const leave = () => { tip.hidden = true; line.setAttribute('visibility', 'hidden'); };
  const hit = $('#chit'); hit.addEventListener('pointermove', move); hit.addEventListener('pointerleave', leave);
}

/* ---------- traceability ---------- */
function traceView() {

  const codes = uniq([...all('rm').map(r => r.lot), ...all('precompost').map(r => r.lot), ...all('beds').map(r => r.prodCode), ...all('harvest').map(r => r.fgBatch), ...all('sales').map(r => r.invoice)]);
  let res = '';
  if (q) {
    const scope = c => rows(c);
    const eq = v => String(v || '').trim().toLowerCase() === q;
    let beds = [];
    const pcsFromRm = scope('precompost').filter(p => eq(p.rmLot)).map(p => p.lot);
    if (pcsFromRm.length) beds = scope('beds').filter(b => pcsFromRm.includes(b.pcLot));
    if (!beds.length) beds = scope('beds').filter(b => eq(b.pcLot) || eq(b.prodCode) || eq(b.bed));
    if (!beds.length) {
      const sale = scope('sales').find(s => eq(s.invoice));
      const fg = sale ? sale.fgBatch.trim().toLowerCase() : q;
      const hs = scope('harvest').filter(h => String(h.fgBatch || '').trim().toLowerCase() === fg);
      beds = scope('beds').filter(b => hs.some(h => h.batch === b.batch && h.bed === b.bed));
    }
    if (!beds.length) res = `<div class="tbl-wrap"><div class="empty"><b>No beds trace to “${esc(state.traceQ)}”</b>Try an RM lot, pre-compost lot, bed number, production code, FG batch or invoice number.</div></div>`;
    else {
      const pcs = scope('precompost').filter(p => beds.some(b => b.pcLot === p.lot));
      const rms = scope('rm').filter(r => pcs.some(p => p.rmLot === r.lot));
      const hv = beds.map(harvestFor).filter(Boolean);
      const fgs = uniq(hv.map(h => h.fgBatch));
      const sales = scope('sales').filter(s => fgs.includes(s.fgBatch));
      const bset = uniq(beds.map(b => b.batch));
      const qc = scope('qc').filter(r => bset.includes(r.batch));
      const stage = (h, qv, items) => `<div class="stage"><h4>${h}</h4><div class="q">${qv}</div><ul>${items.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>`;
      res = `<div class="trace">
        ${stage('Raw material', tons(sum(rms, r => r.qtyKg)) + ' t', uniq(rms.map(r => `${r.lot} · ${r.supplier}`)))}
        ${stage('Pre-compost', fmt(sum(pcs, p => p.weightMT), 1) + ' MT', pcs.map(p => `${p.lot} · ${fdate(p.start)}`))}
        ${stage('Beds', beds.length + ' beds', beds.map(b => `${b.batch} ${b.bed} · ${b.prodCode || ''}`))}
        ${stage('Harvest', fmt(sum(hv, h => h.netKg)) + ' kg', uniq(hv.map(h => h.fgBatch)).map(f => `${f} · ${fmt(sum(hv.filter(h => h.fgBatch === f), h => h.netKg))} kg`))}
        ${stage('Quality', qc.length + ' reports', qc.map(r => `${r.product} ${r.reportNo} · ${r.status}`))}
        ${stage('Sales', fmt(sum(sales, s => s.qtyKg)) + ' kg', sales.map(s => `${s.invoice} · ${s.customer} · ${fmt(s.qtyKg)} kg`))}
      </div><p class="foot">Quality reports are linked by batch. Sales are linked through the finished-goods batch number on the harvest entries.</p>`;
    }
  }
  return head('Traceability', 'Follow any lot forward to its sales or back to its raw material, for EcoCert and MRC / DRC audits.')
    + `<div style="display:flex;gap:8px;flex-wrap:wrap"><input class="search" id="traceQ" list="traceCodes" style="width:min(420px,100%)" placeholder="RM lot, PC lot, bed, VB code, FG batch or invoice" value="${esc(state.traceQ)}" aria-label="Code to trace"><datalist id="traceCodes">${codes.map(c => `<option value="${esc(c)}">`).join('')}</datalist></div>`
    + (res || `<div class="tbl-wrap"><div class="empty"><b>Enter a code to trace</b>For example ${esc(codes[0] || 'RM/20251204/SMC')}.</div></div>`);
}

function repData(R, g, m, sel) {
  const list = all(R.coll).filter(r => sel.includes(r.batch));
  const G = R.groups[g], M = R.measures[m], kind = G[2];
  const raw = r => { const v = G[1](r); return v == null || v === '' ? '' : String(v); };
  let cats = [...new Set(list.map(raw))];
  const total = c => M[1](list.filter(r => raw(r) === c)) || 0;
  if (kind === 'month' || kind === 'date') cats.sort((a, b) => (a || '9999').localeCompare(b || '9999'));
  else if (g === 'bed' || g === 'block') cats.sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  else cats.sort((a, b) => total(b) - total(a));
  let key = raw;
  const cap = kind === 'month' || kind === 'date' || g === 'bed' ? 40 : 14;
  if (cats.length > cap) { const keep = new Set(cats.slice(0, cap - 1)); key = r => keep.has(raw(r)) ? raw(r) : '\u0000other'; cats = [...cats.slice(0, cap - 1), '\u0000other']; }
  const label = c => c === '\u0000other' ? 'Other' : kind === 'month' ? monthLbl(c) : kind === 'date' ? fdate(c) : (c || '(blank)');
  const series = sel.filter(b => list.some(r => r.batch === b));
  const cell = (c, b) => list.filter(r => key(r) === c && r.batch === b);
  return { list, G, M, cats, label, series, cell };
}

function hbars(cats, series, value, label, fmtT, colorOf, tipOf) {
  const vals = cats.flatMap(c => series.map(s => value(c, s))).filter(isNum);
  const max = Math.max(1e-9, ...vals.map(Math.abs));
  return `<div class="hbar">${cats.map(c => `<div class="hb-row"><div class="hb-lbl">${esc(label(c))}</div><div class="hb-bars">${series.map(s => {
    const v = value(c, s);
    if (!isNum(v)) return series.length > 1 ? `<div class="hb-line"><span class="hb-val muted">—</span></div>` : '';
    return `<div class="hb-line" data-tip="${barTip(tipOf(c, s, v))}"><div class="hb-bar" style="width:${(Math.abs(v) / max * 82).toFixed(2)}%;background:${colorOf(s)}"></div><span class="hb-val">${fmtBy(fmtT, v)}</span></div>`;
  }).join('')}</div></div>`).join('')}</div>`;
}

function genReport(R, g, m, sel) {
  const { list, G, M, cats, label, series, cell } = repData(R, g, m, sel);
  if (!list.length) return `<div class="tbl-wrap"><div class="empty"><b>No ${esc(R.title.toLowerCase())} records in the selected batches</b>Tick another batch, or add records in the ${esc(R.title)} tab.</div></div>`;
  const measures = Object.entries(R.measures);
  const tiles = R.tiles.map((k, i) => { const [l, f, t] = R.measures[k]; return `<div class="kpi" style="--k:var(--c${(i % 8) + 1})"><span class="l">${esc(l)}</span><span class="v">${fmtBy(t, f(list))}</span><span class="s">${series.length} batch${series.length === 1 ? '' : 'es'} · ${list.length} records</span></div>`; }).join('');
  // findings: per batch, total of the chart measure, highest and lowest group
  const finds = series.map(b => {
    const bl = list.filter(r => r.batch === b);
    const vals = cats.map(c => [c, M[1](cell(c, b))]).filter(([c, v]) => isNum(v) && cell(c, b).length);
    if (!vals.length) return '';
    const hi = vals.reduce((a, x) => x[1] > a[1] ? x : a), lo = vals.reduce((a, x) => x[1] < a[1] ? x : a);
    return `<li><span class="sw" style="background:${batchColor(b)}"></span><div><b>${esc(b)} · ${esc(M[0])}: ${fmtBy(M[2], M[1](bl))}</b>
      <span>Highest: ${esc(label(hi[0]))} (${fmtBy(M[2], hi[1])})${vals.length > 1 ? ` · Lowest: ${esc(label(lo[0]))} (${fmtBy(M[2], lo[1])})` : ''} · ${vals.length} ${esc(G[0].toLowerCase())} group${vals.length === 1 ? '' : 's'}</span></div></li>`;
  }).join('');
  const legend = series.length > 1 ? `<div class="legend">${series.map(b => `<span><i class="sq" style="background:${batchColor(b)}"></i>${esc(b)}</span>`).join('')}</div>` : '';
  const chart = hbars(cats, series, (c, b) => { const l = cell(c, b); return l.length ? M[1](l) : null; }, label, M[2], batchColor, (c, b, v) => `${b} · ${label(c)}: ${fmtBy(M[2], v)}`);
  const numCols = measures.map(([, v]) => `<th class="n">${esc(v[0])}</th>`).join('');
  const rowsH = cats.flatMap(c => series.map(b => [c, b, cell(c, b)]).filter(x => x[2].length))
    .map(([c, b, l]) => `<tr><td>${esc(label(c))}</td><td class="mono">${esc(b)}</td>${measures.map(([, v]) => `<td class="n">${fmtBy(v[2], v[1](l))}</td>`).join('')}</tr>`).join('');
  const totals = [...series.map(b => [b, list.filter(r => r.batch === b)]), ...(series.length > 1 ? [['All selected', list]] : [])]
    .map(([b, l]) => `<tr><td>Total</td><td class="mono">${esc(b)}</td>${measures.map(([, v]) => `<td class="n">${fmtBy(v[2], v[1](l))}</td>`).join('')}</tr>`).join('');
  return `<div class="kpis">${tiles}</div>
    <div class="grid2"><div class="panel"><h3>${esc(M[0])} by ${esc(G[0].toLowerCase())}</h3>${legend}${chart}</div>
    <div class="panel"><h3>Key findings</h3><ul class="finds">${finds}</ul></div></div>
    <div class="panel"><h3>${esc(R.title)} report · by ${esc(G[0].toLowerCase())}</h3><div class="tbl-wrap"><table><thead><tr><th>${esc(G[0])}</th><th>Batch</th>${numCols}</tr></thead><tbody>${rowsH}</tbody><tfoot>${totals}</tfoot></table></div></div>`;
}

/* quality: RM trials vs FG vs EX, one small chart per parameter */
function qcGroups(sel) {
  const list = all('qc').filter(r => sel.includes(r.batch) && rep.products.includes(r.product)).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  const finished = p => FINISHED.includes(p);
  let groups;
  if (rep.qcBy === 'batch') groups = sel.filter(b => list.some(r => r.batch === b)).map(b => ({ key: b, l1: b, l2: '', color: batchColor(b), rows: list.filter(r => r.batch === b), ref: rep.products.every(finished) }));
  else if (rep.qcBy === 'report') groups = list.map((r, i) => ({ key: r._id, l1: r.product, l2: isISO(r.date) ? r.date.slice(8) + '/' + r.date.slice(5, 7) : '#' + (i + 1), full: `${r.product} · ${fdate(r.date)} · ${r.reportNo || ''}`, color: prodColor(r.product), rows: [r], ref: finished(r.product) }));
  else groups = PRODUCTS.map(p => p[0]).filter(p => rep.products.includes(p) && list.some(r => r.product === p)).map(p => ({ key: p, l1: p, l2: `${list.filter(r => r.product === p).length} rep.`, color: prodColor(p), rows: list.filter(r => r.product === p), ref: finished(p) }));
  groups.forEach(g => { g.full = g.full || (rep.qcBy === 'batch' ? `Batch ${g.key}` : PRODUCTS.find(p => p[0] === g.key)?.[1] || g.key); });
  return { list, groups };
}
function qcSmall([k, name, unit], groups) {
  const W = 260, H = 168, ml = 6, mr = 6, mt = 20, mb = 32;
  const vals = groups.map(g => avg(g.rows, r => r[k]));
  const ref = FCO[k], refs = ref ? [ref[0], ref[1]].filter(v => v != null) : [];
  const title = `<h4>${esc(name)}${unit ? ` <span class="muted">(${unit})</span>` : ''}</h4><div class="ref">${ref ? 'FCO ' + esc(ref[2].replace(/^[^0-9≤≥]*/, '')) : 'No FCO limit'}</div>`;
  if (!vals.some(isNum)) return `<div class="small">${title}<div class="empty" style="padding:18px 4px">No values</div></div>`;
  const ymax = Math.max(...vals.filter(isNum), ...refs) * 1.2 || 1;
  const slot = (W - ml - mr) / groups.length, bw = Math.min(40, slot * 0.64);
  const y = v => mt + (1 - v / ymax) * (H - mt - mb), y0 = y(0);
  const bars = groups.map((g, i) => {
    const v = vals[i]; if (!isNum(v)) return '';
    const x = ml + slot * i + (slot - bw) / 2, top = y(Math.max(v, 0)), h = Math.max(1, y0 - top), r = Math.min(4, h, bw / 2);

function qcReport(sel) {

  const tiles = PRODUCTS.filter(p => rep.products.includes(p[0])).map(([p, l, pc]) => {
    const l2 = byP(p), fin = FINISHED.includes(p), off = fin ? l2.filter(r => Object.keys(FCO).some(k => isNum(r[k]) && outOfRange(k, r[k]))).length : 0;
    return `<div class="kpi" style="--k:${pc}"><span class="l">${esc(l)}</span><span class="v">${l2.length}<small>report${l2.length === 1 ? '' : 's'}</small></span><span class="s">${l2.length ? (fin ? `${off} outside FCO reference · ` : '') + 'latest ' + fdate(l2[l2.length - 1].date) : 'none recorded yet'}</span></div>`;
  }).join('');
  const legend = `<div class="legend">${(rep.qcBy === 'batch' ? groups : PRODUCTS.filter(p => rep.products.includes(p[0])).map(p => ({ full: p[1], color: p[2] }))).map(g => `<span><i class="sq" style="background:${g.color}"></i>${esc(g.full)}</span>`).join('')}<span><i style="background:none;border-top:2px dashed var(--muted);height:0"></i>FCO limit</span></div>`;
  // comparison table: parameter rows x group columns
  const th = groups.map(g => `<th class="n" title="${esc(g.full)}">${esc(rep.qcBy === 'report' ? g.full : g.l1)}</th>`).join('');

  }).join('')}<td class="muted">${FCO[k] ? esc(FCO[k][2]) : ''}</td></tr>`).join('');

  const inSel = all('qc').filter(r => sel.includes(r.batch));
  const latest = p => inSel.filter(r => r.product === p).sort((a, b) => (a.date || '').localeCompare(b.date || '')).pop();
  const pairs = [['RM', 'FG'], ['EXRM', 'EXFG']].map(([a, b]) => [a, b, latest(a), latest(b)]).filter(x => x[2] && x[3]);
  const latestHTML = pairs.map(([a, b, ra, rb]) => `<h4 style="margin:4px 0 0;font-size:14px">${b} ${esc(rb.reportNo || '')} (${fdate(rb.date)}) against ${a} ${esc(ra.reportNo || '')} (${fdate(ra.date)})</h4>
    <div class="tbl-wrap"><table><thead><tr><th>Parameter</th><th class="n">Latest ${a}</th><th class="n">Latest ${b}</th><th class="n">Change</th><th>FCO reference</th><th>${b} check</th></tr></thead><tbody>${QC_PARAMS.map(([k, name, unit]) => {
      const x = ra[k], y = rb[k], off = FCO[k] && isNum(y) && outOfRange(k, y);

      return `<tr><td>${esc(name)}${unit ? ' <span class="muted">' + unit + '</span>' : ''}</td><td class="n">${isNum(x) ? fmt(x, 2) : '—'}</td><td class="n${off ? ' off' : ''}">${isNum(y) ? fmt(y, 2) : '—'}</td><td class="n">${ch}</td><td class="muted">${FCO[k] ? esc(FCO[k][2]) : ''}</td><td>${!FCO[k] || !isNum(y) ? '' : `<span class="chip ${off ? 'bad' : 'good'}">${off ? 'Outside FCO' : 'Within FCO'}</span>`}</td></tr>`;
    }).join('')}</tbody></table></div>`).join('');
  const reportsList = list.map(r => `<tr><td>${fdate(r.date)}</td><td class="mono">${esc(r.batch)}</td><td><span class="chip ${chipClass(r.product)}">${esc(r.product)}</span></td><td class="mono">${esc(r.reportNo)}</td><td>${esc(r.lab)}</td><td>${r.status ? `<span class="chip ${chipClass(r.status)}">${esc(r.status)}</span>` : ''}</td></tr>`).join('');
  return `<div class="kpis">${tiles}</div>
    <div class="panel"><h3>Lab parameters · ${rep.qcBy === 'product' ? 'average by product type' : rep.qcBy === 'batch' ? 'average by batch' : 'each lab report'}</h3>

    <div class="panel"><h3>Quality comparison report</h3><div class="tbl-wrap"><table><thead><tr><th>Parameter</th>${th}<th>FCO reference</th></tr></thead><tbody>${tr}
      <tr><td class="muted">Reports included</td>${groups.map(g => `<td class="n muted">${g.rows.length}</td>`).join('')}<td></td></tr></tbody></table></div>
      <p class="foot">Check whether your lab reports P and K as P₂O₅ and K₂O before comparing with the FCO reference.</p></div>
    <div class="panel"><h3>Lab reports included</h3><div class="tbl-wrap"><table><thead><tr><th>Sampled</th><th>Batch</th><th>Product</th><th>Report no.</th><th>Lab</th><th>FCO status</th></tr></thead><tbody>${reportsList}</tbody></table></div></div>`;
}

async function exportReport() {
  try {
    toast('Preparing report…');
    await loadXLSX();
    const sel = repBatches(), wb = XLSX.utils.book_new();
    let name;
    if (rep.type === 'qc') {
      const { list, groups } = qcGroups(sel);
      const params = [...QC_PARAMS, ...(rep.micro ? QC_MICRO : [])];
      const rows = [['Parameter', ...groups.map(g => g.full), 'FCO reference'], ...params.map(([k, n, u]) => [n + (u ? ` (${u})` : ''), ...groups.map(g => { const v = avg(g.rows, r => r[k]); return isNum(v) ? +v.toFixed(3) : ''; }), FCO[k] ? FCO[k][2] : '']),
        ['Reports included', ...groups.map(g => g.rows.length), '']];
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), 'Quality comparison');
      const keys = [...QC_PARAMS, ...QC_MICRO];
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Sampled', 'Batch', 'Product', 'Report no.', 'Lab', 'FCO status', ...keys.map(p => p[1])],
        ...list.map(r => [r.date, r.batch, r.product, r.reportNo, r.lab, r.status, ...keys.map(p => r[p[0]] ?? '')])]), 'Lab reports');
      name = 'quality';
    } else {
      const R = REPORTS[rep.type], g = rep.group[rep.type] in R.groups ? rep.group[rep.type] : R.def[0], m = rep.measure[rep.type] in R.measures ? rep.measure[rep.type] : R.def[1];
      const { list, G, cats, label, series, cell } = repData(R, g, m, sel), ms = Object.values(R.measures);
      const rows = [[G[0], 'Batch', ...ms.map(v => v[0])]];
      cats.forEach(c => series.forEach(b => { const l = cell(c, b); if (l.length) rows.push([label(c), b, ...ms.map(v => { const x = v[1](l); return isNum(x) ? +x.toFixed(2) : ''; })]); }));
      series.forEach(b => { const l = list.filter(r => r.batch === b); rows.push(['Total', b, ...ms.map(v => { const x = v[1](l); return isNum(x) ? +x.toFixed(2) : ''; })]); });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), (R.title + ' report').slice(0, 31));
      name = rep.type + '_by_' + g;
    }
    const buf = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
    await state.dl.save({ filename: `Navjyoti_report_${name}_${sel.join('-')}_${TODAY}.xlsx`, data: buf });
    toast('Report ready');
  } catch (e) { toast(e?.code === 'declined' ? 'Download cancelled' : 'Report failed: ' + (e?.message || 'could not build the workbook')); }
}

function errText(e) {
  if (e?.code === 'invalid_argument') { state.canWrite = false; schedule(); return 'Your access is view-only. Ask the owner to share the tracker with you as Contributor or Editor.'; }

/* ---------- export ---------- */
function loadXLSX() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
}
async function exportXLSX() {
  try {
    toast('Preparing workbook…');
    await loadXLSX();
    const wb = XLSX.utils.book_new();
    const order = ['rm', 'precompost', 'beds', 'harvest', 'qc', 'sales', 'expenses', 'earthworm', 'batches'];
    for (const key of order) {
      const def = REG[key], list = sortedRows(key);
      const flds = def.fields.filter(f => f.t !== 'turns');
      const hdr = [...(def.noBatch ? [] : ['Batch']), ...flds.map(f => f.l)];
      const extra = key === 'rm' ? ['Amount (₹)'] : key === 'sales' ? ['Revenue (₹)'] : key === 'earthworm' ? ['Amount (₹)'] : key === 'precompost' ? ['Turnings (date / °C / % / watered)'] : [];
      const data = list.map(r => [...(def.noBatch ? [] : [r.batch]), ...flds.map(f => r[f.k] ?? ''),
        ...(key === 'rm' ? [r.qtyKg * r.rate || ''] : key === 'sales' ? [r.qtyKg * r.price || ''] : key === 'earthworm' ? [r.wormsKg * r.rate || ''] : key === 'precompost' ? [(r.turns || []).map(t => `${t.date} / ${t.temp ?? ''} / ${t.moisture ?? ''} / ${t.watering || ''}`).join('; ')] : [])]);
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([[...hdr, ...extra], ...data]), def.title.slice(0, 31));
    }
    const buf = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
    await state.dl.save({ filename: `Navjyoti_${state.batch === 'ALL' ? 'all_batches' : state.batch}_register_${TODAY}.xlsx`, data: buf });
    toast('Workbook ready');
  } catch (e) { toast(e?.code === 'declined' ? 'Export cancelled' : 'Export failed: ' + (e?.message || 'could not build the workbook')); }
}

/* ---------- events ---------- */
let toastT;
function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2800); }
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-add],[data-edit],[data-sort],[data-act],[data-bedview],[data-rtype],[data-qcby]');
  if (!t) return;
  if (t.dataset.tab) { state.tab = t.dataset.tab; store.set('nv.tab', state.tab); history.replaceState(null, '', '#' + state.tab); render(); window.scrollTo(0, 0); }
  else if (t.dataset.add) openForm(t.dataset.add, null);
  else if (t.dataset.edit) { if (!state.canWrite) return; const [k, id] = t.dataset.edit.split(/:(.*)/s); const rec = all(k).find(r => r._id === id); if (rec) openForm(k, rec); }
  else if (t.dataset.sort) { const [k, c] = t.dataset.sort.split(':'); const ui = state.ui[k]; ui.dir = ui.sort === c && ui.dir === 'asc' ? 'desc' : 'asc'; ui.sort = c; render(); }
  else if (t.dataset.bedview) { state.bedView = t.dataset.bedview; render(); }
  else if (t.dataset.act === 'close') dlg.close();
  else if (t.dataset.act === 'del') deleteRec();
  else if (t.dataset.act === 'addturn') $('#f_turns').insertAdjacentHTML('beforeend', turnRow());
  else if (t.dataset.act === 'rmturn') t.closest('.turn-row').remove();
  else if (t.dataset.act === 'bulkadd') openBulkAdd();
  else if (t.dataset.act === 'bulkupd') openBulkUpd();
  else if (t.dataset.act === 'repxlsx') exportReport();
  else if (t.dataset.rtype) { rep.type = t.dataset.rtype; saveRep(); render(); }
  else if (t.dataset.qcby) { rep.qcBy = t.dataset.qcby; saveRep(); render(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.classList.contains('rep-batch')) { rep.batches = [...document.querySelectorAll('.rep-batch:checked')].map(i => i.value); if (!rep.batches.length) { rep.batches = [el.value]; } }
  else if (el.classList.contains('rep-prod')) { rep.products = [...document.querySelectorAll('.rep-prod:checked')].map(i => i.value); if (!rep.products.length) rep.products = [el.value]; }
  else if (el.id === 'rep_micro') rep.micro = el.checked;
  else if (el.id === 'rep_group') rep.group[rep.type] = el.value;
  else if (el.id === 'rep_measure') rep.measure[rep.type] = el.value;
  else return;
  saveRep(); render();
});
const vtip = $('#vtip');
document.addEventListener('pointermove', e => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (!t) { vtip.hidden = true; return; }
  vtip.textContent = t.dataset.tip; vtip.hidden = false;
  const w = vtip.offsetWidth, x = Math.min(e.clientX + 12, window.innerWidth - w - 8);
  vtip.style.left = Math.max(8, x) + 'px'; vtip.style.top = (e.clientY - vtip.offsetHeight - 10) + 'px';
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('tr[data-edit]')) e.target.click(); });
document.addEventListener('input', e => {
  const id = e.target.id || '';
  if (id.startsWith('q_')) { const k = id.slice(2); state.ui[k].q = e.target.value; $('#tbl_' + k).innerHTML = tableHTML(k, sortedRows(k)); }
  if (id === 'traceQ') { state.traceQ = e.target.value; render(); }
});
form.addEventListener('submit', e => {
  e.preventDefault();
  if (!state.db) return msg('Not connected. Open the tracker on claude.ai while signed in.');
  if (editing.key === '_bulkadd') runBulkAdd(); else if (editing.key === '_bulkupd') runBulkUpd(); else saveForm();
});
$('#batchSel').addEventListener('change', e => { state.batch = e.target.value; store.set('nv.batch', state.batch); rep.batches = null; render(); });
$('#exportBtn').addEventListener('click', exportXLSX);

/* ---------- connect ---------- */
async function connect() {
  const claude = window.claude;
  const db = claude?.use ? await claude.use('db') : null;
  if (!db) { state.conn = 'off'; render(); return; }
  state.db = db;
  claude.use('user').then(async u => { if (!u) return; const w = await u.can('data.write'); if (w === false) { state.canWrite = false; schedule(); } }).catch(() => {});
  claude.use('downloads').then(d => { state.dl = d; schedule(); }).catch(() => {});
  COLLS.forEach(c => db.collection(c).onSnapshot(snap => {
    state.data[c] = snap.docs.map(d => ({ ...d.data(), _id: d.id }));
    state.loaded.add(c);
    if (state.loaded.size === COLLS.length) state.conn = 'live';
    schedule();
  }, err => { if (err?.code === 'revoked' || err?.code === 'not_granted') { state.conn = 'off'; state.db = null; } schedule(); }));
  setTimeout(() => { if (state.conn === 'connecting') { state.conn = 'live'; schedule(); } }, 8000);
}
renderChrome();
connect();
})();
</script>
