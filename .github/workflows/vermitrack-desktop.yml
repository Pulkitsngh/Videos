name: VermiTrack desktop installers

on:
  workflow_dispatch:
  push:
    paths:
      - "vermitrack-desktop/**"
      - ".github/workflows/vermitrack-desktop.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            artifact: VermiTrack-Windows-installer
            files: vermitrack-desktop/release/*.exe
          - os: macos-latest
            target: --mac
            artifact: VermiTrack-Mac-installer
            files: vermitrack-desktop/release/*.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: vermitrack-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vermitrack-desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Rename installers for simple download links
        run: |
          cd installers
          for f in *.exe; do mv "$f" VermiTrack-Windows-Setup.exe; done
          for f in *.dmg; do mv "$f" VermiTrack-Mac.dmg; done
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: vermitrack-desktop-latest
          name: Navjyoti VermiTrack desktop (latest)
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Download **VermiTrack-Windows-Setup.exe** (Windows) or **VermiTrack-Mac.dmg** (Mac) below.
            Windows: if SmartScreen appears, click "More info" → "Run anyway".
            Setup steps: vermitrack-desktop/SETUP-GUIDE.md
          files: installers/*
          overwrite_files: true
